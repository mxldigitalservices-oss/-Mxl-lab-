<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MXL Lab: práctica y auditoría de Python</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>MXL Lab</h1>
    <div id="session" hidden><span id="who"></span> <button id="logout" class="ghost">Salir</button></div>
  </header>
  <main>
    <aside id="left">
      <section id="auth">
        <input id="user" placeholder="usuario" autocomplete="username" maxlength="32">
        <input id="pass" type="password" placeholder="contraseña (mín. 8)" autocomplete="current-password">
        <div class="row">
          <button id="login">Entrar</button>
          <button id="register" class="ghost">Crear cuenta</button>
        </div>
        <p id="auth-msg" class="err"></p>
      </section>
      <h2>Lecciones</h2>
      <div id="lessons" class="list"></div>
      <h2>Retos</h2>
      <div id="challenges" class="list"></div>
    </aside>

    <section id="center">
      <div id="brief-box">
        <h2 id="brief-title">Práctica libre</h2>
        <p id="brief">Escribe Python y pulsa Ejecutar (Ctrl+Enter). Elige una lección o un reto en el panel izquierdo.</p>
      </div>
      <div id="editor">
        <pre id="gutter" aria-hidden="true">1</pre>
        <textarea id="code" wrap="off" spellcheck="false" aria-label="Editor de código">print("Hola, MXL")</textarea>
      </div>
      <div class="bar">
        <button id="run">Ejecutar</button>
        <button id="submit" hidden>Enviar solución</button>
        <span id="status" class="muted"></span>
      </div>
      <details>
        <summary>Entrada estándar (input)</summary>
        <textarea id="stdin" rows="3" spellcheck="false" aria-label="Entrada estándar"></textarea>
      </details>
      <pre id="out" aria-live="polite">La salida aparecerá aquí.</pre>
    </section>

    <aside id="right">
      <h2>Auditoría</h2>
      <div id="audit" class="muted">Ejecuta código para recibir una auditoría.</div>
      <h2>Historial</h2>
      <div id="history" class="muted">Inicia sesión para ver tu historial.</div>
    </aside>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
