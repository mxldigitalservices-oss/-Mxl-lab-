# Bases de datos para desarrollo local: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: mxl, POSTGRES_PASSWORD: mxl, POSTGRES_DB: mxl }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
